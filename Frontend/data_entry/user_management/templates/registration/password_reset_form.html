{% load static %}
<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Password reset</title>
</head>
<body>
    <h1>Reset your password</h1>
    <p>Enter your account email and we'll send a link to reset your password.</p>

    {% if form.errors %}
        <p style="color:red">Please correct the error below.</p>
    {% endif %}

    <form method="post">
        {% csrf_token %}
        {{ form.email.label_tag }}<br>
        {{ form.email }}<br><br>
        <button type="submit">Send reset email</button>
    </form>

    <p><a href="{% url 'login' %}">Back to login</a></p>
</body>
</html>
